<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div>
        <h1>Camunda AI Ops</h1>
        <p>Operations Assistant</p>
      </div>
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
        title="Toggle light/dark theme"
      >{{ isDarkTheme() ? '☀️' : '🌙' }}</button>
    </div>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
      <a routerLink="/process-instances" routerLinkActive="active">Process Instances</a>
      <a routerLink="/incidents" routerLinkActive="active">Incidents</a>
      <a routerLink="/process-definitions" routerLinkActive="active">Process Definitions</a>
      <a routerLink="/investigation" routerLinkActive="active">AI Investigation</a>
      <a routerLink="/knowledge-base" routerLinkActive="active">Documents / Knowledge Base</a>
    </nav>
  </aside>
  <main class="content"><router-outlet /></main>
</div>
